# goreleaser — GitHub Releases static binary + checksums (DESIGN §10).
# Not a build dependency: `make release-check` validates this file only.
version: 2

project_name: ompinyin

builds:
  - id: ompinyin
    main: ./cmd/ompinyin
    binary: ompinyin
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/ProjectAILeap/ompinyin/internal/catalog.Version={{.Version}}

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

# Bare binaries, named WITHOUT the version so `releases/latest/download/…`
# keeps working as the project grows. Version is still recoverable at runtime
# via `ompinyin version`.
archives:
  - id: ompinyin
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - binary

# The release body stays short and points at the README for install/rollback.
release:
  mode: replace
  header: |
    ## ompinyin {{ .Tag }}

    在 **Omarchy**（Arch + Hyprland + Wayland）上一键部署中文输入法栈：
    **雾凇全拼 + 万象 LMDG 整句模型 + 顶栏输入法图标 + 候选框跟随 Omarchy 主题配色**。

    - 双拼按需可选：`--dsp zrm|flypy|mspy|sogou|abc|ziguang|jiajia`（F4 切方案，Alt+Space 切中英）
    - X11/XWayland 应用（如微信）候选框过小时可选 `--x11-hidpi`：默认只诊断，撤销用 `--no-x11-hidpi`
    - 幂等可反复执行：重跑只改不同部分，`--dry-run` 预览，`uninstall` 回滚

    从本页按架构下载：`ompinyin_linux_amd64`（X86_64）或 `ompinyin_linux_arm64`（ARM64），
    下载后建议用 `checksums.txt` 里的 sha256 校验。安装：

    ```bash
    curl -fsSL -o ompinyin https://github.com/ProjectAILeap/ompinyin/releases/latest/download/ompinyin_linux_amd64
    install -Dm755 ompinyin ~/.local/bin/ompinyin
    ompinyin install
    ```

    已装过：`ompinyin update` 刷新数据资产，`ompinyin update --self` 升级自身。

changelog:
  sort: asc
  filters:
    # Anchored to the conventional-commit TYPE, scope included: a plain
    # "^test:" never matched "test(assets):", which is how internal-only
    # commits (5 refactor + 2 test) showed up in the v1.2.0 changelog.
    # refactor belongs here too: by definition it changes no behaviour.
    exclude:
      - "^docs(\\([^)]*\\))?:"
      - "^chore(\\([^)]*\\))?:"
      - "^test(\\([^)]*\\))?:"
      - "^refactor(\\([^)]*\\))?:"
